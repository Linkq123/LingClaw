<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingClaw</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f6fa; --surface: #ffffff; --surface2: #edf0f7;
  --msg-user: #dbeafe; --msg-ai: #ffffff; --accent: #e94560; --accent2: #0284c7;
  --accent-error: #dc2626; --accent-success: #16a34a; --accent-warn: #d97706;
  --text: #1e1e2e; --dim: #6b7280; --border: #e0e2ea;
  --tool-bg: #f5f7fa; --tool-border: #dde0e8;
  --sidebar-w: 260px;
}
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

/* ── Animations ── */
@keyframes blink { 50% { opacity: 0; } }
@keyframes msgSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* ── Sidebar ── */
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left .25s ease, opacity .25s ease; }
.sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); opacity: 0; pointer-events: none; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, rgba(233,69,96,.08), transparent); }
.sidebar-header h2 { font-size: 15px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.sidebar-header button { background: none; border: 1px solid var(--border); color: var(--dim); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all .2s; }
.sidebar-header button:hover { border-color: var(--accent); color: var(--text); background: rgba(233,69,96,.1); }
#session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--dim); margin-bottom: 2px; display: flex; flex-direction: column; gap: 4px; transition: all .15s; }
.session-item:hover { background: var(--surface2); color: var(--text); }
.session-item.active { background: var(--surface2); color: var(--text); border-left: 2px solid var(--accent); }
.session-item .session-top { display: flex; justify-content: space-between; align-items: center; }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.session-item .meta { font-size: 11px; color: var(--dim); margin-left: 8px; flex-shrink: 0; }
.session-item .session-time { font-size: 10px; color: var(--dim); opacity: .6; }

/* ── Main area ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { padding: 10px 16px; background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.06); display: flex; align-items: center; gap: 12px; z-index: 2; position: relative; }
header .toggle-sidebar { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; padding: 2px 6px; transition: color .2s; }
header .toggle-sidebar:hover { color: var(--text); }
header .session-name { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .session-id { font-size: 11px; color: var(--dim); font-family: monospace; }
header .actions { display: flex; gap: 6px; }
header .actions button { background: none; border: 1px solid var(--border); color: var(--dim); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .2s; }
header .actions button:hover { border-color: var(--accent2); color: var(--text); background: rgba(14,165,233,.08); }
.conn-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); flex-shrink: 0; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background .3s; }
.conn-dot.connected { background: var(--accent-success); box-shadow: 0 0 6px rgba(34,197,94,.4); }
.conn-dot.disconnected { background: var(--accent-error); animation: pulse 1.5s infinite; }
.conn-label { letter-spacing: .3px; }

/* ── Chat ── */
#chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

/* ── Welcome screen ── */
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; color: var(--dim); text-align: center; user-select: none; padding: 40px; }
.welcome-logo { font-size: 56px; }
.welcome-title { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.welcome-hint { font-size: 13px; line-height: 1.8; max-width: 320px; }
.welcome-shortcuts { display: flex; gap: 8px; margin-top: 8px; }
.welcome-shortcuts button { background: var(--surface2); border: 1px solid var(--border); color: var(--dim); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all .2s; }
.welcome-shortcuts button:hover { border-color: var(--accent2); color: var(--text); background: rgba(14,165,233,.1); }

/* ── Message rows ── */
.msg-row { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; animation: msgSlideIn .3s ease; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.assistant { align-self: flex-start; }
.msg-row.system, .msg-row.error { align-self: flex-start; max-width: 85%; }
.no-animate .msg-row, .no-animate .tool-panel, .no-animate .reasoning-panel { animation: none !important; }
.msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; font-size: 13px; }
.msg-row.user .msg-avatar { background: linear-gradient(135deg, #1a5276, #0f3460); color: var(--accent2); font-size: 12px; }
.msg-row.assistant .msg-avatar { background: linear-gradient(135deg, #e2e6f0, #c5cade); font-size: 16px; }
.msg-content { min-width: 0; }
.msg-time { font-size: 10px; color: var(--dim); margin-top: 3px; opacity: 0; transition: opacity .2s; }
.msg-row:hover .msg-time { opacity: .6; }
.msg-row.user .msg-time { text-align: right; }

/* ── Message bubbles ── */
.msg { padding: 10px 14px; border-radius: 10px; line-height: 1.65; font-size: 14px; word-break: break-word; }
.msg.user { background: var(--msg-user); border-bottom-right-radius: 2px; }
.msg.assistant { background: var(--msg-ai); border: 1px solid var(--border); border-bottom-left-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.msg.assistant p { margin: 0 0 8px; }
.msg.assistant p:last-child { margin-bottom: 0; }
.msg.assistant pre { margin: 8px 0; position: relative; }
.msg.assistant code { font-size: 13px; }
.msg.assistant pre code { display: block; padding: 12px; border-radius: 6px; overflow-x: auto; }
.msg.assistant :not(pre) > code { background: var(--tool-bg); padding: 1px 5px; border-radius: 3px; font-size: 13px; }
/* ── System / Command cards ── */
.system-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--dim); animation: msgSlideIn .3s ease; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
.system-card.system-inline { display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
.system-card.error-card { border-left-color: var(--accent-error); }
.system-icon { font-size: 14px; flex-shrink: 0; }
.system-header { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); margin-bottom: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.system-body { margin: 0; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: var(--text); background: var(--bg); border-radius: 6px; padding: 10px 12px; border: 1px solid var(--border); overflow-x: auto; }
.typing::after { content: '▌'; animation: blink .6s infinite; }

/* ── Reasoning panel ── */
.reasoning-panel { align-self: flex-start; width: 85%; max-width: 85%; border: 1px solid var(--border); border-left: 3px solid var(--accent-warn); border-radius: 8px; margin: 2px 0; overflow: hidden; font-size: 13px; animation: msgSlideIn .3s ease; flex-shrink: 0; }
.reasoning-header { padding: 6px 12px; background: rgba(217,119,6,.06); cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--dim); transition: background .15s; }
.reasoning-header:hover { background: rgba(217,119,6,.12); }
.reasoning-header .reasoning-icon { color: var(--accent-warn); }
.reasoning-header .reasoning-label { font-weight: 600; color: var(--text); font-size: 12px; }
.reasoning-header .reasoning-status { font-size: 11px; color: var(--dim); margin-left: auto; }
.reasoning-header .chevron { margin-left: 8px; transition: transform .25s ease; }
.reasoning-header .chevron.open { transform: rotate(90deg); }
.reasoning-body { max-height: 0; overflow: hidden; padding: 0 12px; background: rgba(217,119,6,.03); font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: var(--dim); transition: max-height .3s ease, padding .3s ease; }
.reasoning-body.show { max-height: 400px; padding: 8px 12px; overflow-y: auto; }
.reasoning-active .reasoning-status::after { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent-warn); border-radius: 50%; margin-left: 6px; animation: pulse 1s infinite; }

/* ── Code language label ── */
.code-lang-label { position: absolute; top: 6px; left: 12px; font-size: 10px; color: var(--dim); opacity: .6; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; pointer-events: none; }

/* ── Tool panels ── */
.tool-panel { align-self: flex-start; width: 85%; max-width: 85%; border: 1px solid var(--tool-border); border-radius: 8px; margin: 2px 0; overflow: hidden; font-size: 13px; animation: msgSlideIn .3s ease; flex-shrink: 0; }
.tool-header { padding: 6px 12px; background: var(--tool-bg); cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--dim); transition: background .15s; }
.tool-header:hover { background: #eaecf2; }
.tool-header .tool-icon { color: var(--accent2); }
.tool-header .tool-name { font-weight: 600; color: var(--text); }
.tool-header .chevron { margin-left: auto; transition: transform .25s ease; }
.tool-header .chevron.open { transform: rotate(90deg); }
.tool-body { max-height: 0; overflow: hidden; padding: 0 12px; background: var(--tool-bg); border-top: 1px solid transparent; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: var(--dim); transition: max-height .3s ease, padding .3s ease, border-color .3s ease; }
.tool-body.show { max-height: 300px; padding: 8px 12px; overflow-y: auto; border-top-color: var(--tool-border); }

/* ── Copy button ── */
.copy-btn { position: absolute; top: 6px; right: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--dim); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; opacity: 0; transition: opacity .2s, transform .2s, border-color .2s; }
pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--text); border-color: var(--accent2); transform: translateY(-2px); }

/* ── Input area ── */
#input-area { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); padding: 10px 18px; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
#input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,69,96,.15); }
#send { background: linear-gradient(135deg, var(--accent), #c13550); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: opacity .2s, transform .15s; flex-shrink: 0; }
#send:hover:not(:disabled) { transform: scale(1.05); }
#send:active:not(:disabled) { transform: scale(.95); }
#send:disabled { opacity: .4; cursor: not-allowed; }
#send .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b0b5c0; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar { position: absolute; z-index: 10; height: 100vh; }
  .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); opacity: 0; pointer-events: none; }
  .msg-row { max-width: 95%; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>🦀 Sessions</h2>
    <button onclick="newSession()" title="New session">+</button>
  </div>
  <div id="session-list"></div>
</aside>

<!-- Main -->
<div class="main">
  <header>
    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
    <div class="conn-badge" id="conn-badge">
      <span class="conn-dot disconnected" id="conn-dot"></span>
      <span class="conn-label" id="conn-label">Offline</span>
    </div>
    <span class="session-name" id="session-name">LingClaw</span>
    <span class="session-id" id="session-id"></span>
    <div class="actions">
      <button onclick="sendCmd('/status')">Status</button>
      <button onclick="sendCmd('/clear')">Clear</button>
      <button onclick="sendCmd('/help')">Help</button>
    </div>
  </header>
  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">🦀</div>
      <div class="welcome-title">LingClaw</div>
      <div class="welcome-hint">
        你的私人 AI 助手已就绪<br>
        输入消息开始对话，或使用 <strong>/</strong> 命令
      </div>
      <div class="welcome-shortcuts">
        <button onclick="sendCmd('/status')">📊 Status</button>
        <button onclick="sendCmd('/help')">❓ Help</button>
        <button onclick="newSession()">✨ New Chat</button>
      </div>
    </div>
  </div>
  <div id="input-area">
    <textarea id="input" placeholder="Message LingClaw... (/ for commands)" rows="1"></textarea>
    <button id="send"><span id="send-icon">↑</span></button>
  </div>
</div>

<script>
// ── State ──
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sendIcon = document.getElementById('send-icon');
const connDot = document.getElementById('conn-dot');
const connLabel = document.getElementById('conn-label');
const sessionNameEl = document.getElementById('session-name');
const sessionIdEl = document.getElementById('session-id');
const sessionList = document.getElementById('session-list');

let ws = null;
let currentMsg = null;
let busy = false;
let currentSessionId = '';
let sessions = [];
let reasoningPanel = null;
let sessionAvatar = null;

// ── Markdown setup ──
marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
});

// ── WebSocket ──
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const stored = sessionStorage.getItem('lingclaw_session');
  const qs = stored ? `?session=${encodeURIComponent(stored)}` : '';
  ws = new WebSocket(`${proto}://${location.host}/ws${qs}`);

  ws.onopen = () => {
    connDot.className = 'conn-dot connected';
    connLabel.textContent = 'Online';
    addSystem('Connected.');
  };

  ws.onclose = () => {
    connDot.className = 'conn-dot disconnected';
    connLabel.textContent = 'Offline';
    currentMsg = null;
    reasoningPanel = null;
    setBusy(false);
    addSystem('Disconnected. Reconnecting...');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleMessage(data);
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'session':
      currentSessionId = data.id;
      sessionNameEl.textContent = data.name || 'New Chat';
      sessionIdEl.textContent = data.id.slice(0, 12);
      sessionStorage.setItem('lingclaw_session', data.id);
      applySessionAvatar(data.avatar || null);
      break;

    case 'session_switched':
      currentSessionId = data.id;
      sessionNameEl.textContent = data.name || 'New Chat';
      sessionIdEl.textContent = data.id.slice(0, 12);
      sessionStorage.setItem('lingclaw_session', data.id);
      applySessionAvatar(data.avatar || null);
      chat.innerHTML = '';
      currentMsg = null;
      reasoningPanel = null;
      setBusy(false);
      break;

    case 'history': {
      chat.innerHTML = '';
      const msgs = data.messages || [];
      if (msgs.length === 0) {
        showWelcome();
      } else {
        chat.classList.add('no-animate');
        for (const m of msgs) {
          switch (m.role) {
            case 'user': addMsg('user', m.content, m.timestamp); break;
            case 'assistant': {
              const el = addMsg('assistant', m.content, m.timestamp);
              el._rawText = m.content;
              renderMarkdown(el);
              break;
            }
            case 'tool_call': addToolCall(m.name, m.arguments, m.id); break;
            case 'tool_result': addToolResult('', m.result, m.id); break;
          }
        }
        requestAnimationFrame(() => chat.classList.remove('no-animate'));
      }
      break;
    }

    case 'sessions_list':
      sessions = data.sessions || [];
      renderSessionList();
      break;

    case 'avatar_update':
      if (!data.session_id || data.session_id === currentSessionId) {
        applySessionAvatar(data.avatar || null);
      }
      break;

    case 'start':
      if (data.avatar !== undefined) applySessionAvatar(data.avatar || null);
      currentMsg = addAssistant('');
      currentMsg.classList.add('typing');
      break;

    case 'delta':
      if (currentMsg) {
        currentMsg._rawText = (currentMsg._rawText || '') + data.content;
        currentMsg.textContent = currentMsg._rawText;
      }
      scrollDown();
      break;

    case 'done':
      if (currentMsg) {
        currentMsg.classList.remove('typing');
        renderMarkdown(currentMsg);
        currentMsg = null;
      }
      reasoningPanel = null;
      setBusy(false);
      break;

    case 'thinking_start': {
      const panel = document.createElement('div');
      panel.className = 'reasoning-panel reasoning-active';
      panel.innerHTML = `
        <div class="reasoning-header" onclick="toggleTool(this)">
          <span class="reasoning-icon">💭</span>
          <span class="reasoning-label">Reasoning</span>
          <span class="reasoning-status">推理中</span>
          <span class="chevron open">▸</span>
        </div>
        <div class="reasoning-body show"></div>
      `;
      // Insert reasoning panel before the current assistant bubble (if exists)
      const currentRow = currentMsg ? currentMsg.closest('.msg-row') : null;
      if (currentRow) {
        chat.insertBefore(panel, currentRow);
      } else {
        chat.appendChild(panel);
      }
      reasoningPanel = panel;
      hideWelcome();
      scrollDown();
      break;
    }

    case 'thinking_delta':
      if (reasoningPanel) {
        const body = reasoningPanel.querySelector('.reasoning-body');
        body.textContent += data.content;
        scrollDown();
      }
      break;

    case 'thinking_done':
      if (reasoningPanel) {
        reasoningPanel.classList.remove('reasoning-active');
        const status = reasoningPanel.querySelector('.reasoning-status');
        if (status) status.textContent = '完成';
        // Collapse after a short delay
        const body = reasoningPanel.querySelector('.reasoning-body');
        const chevron = reasoningPanel.querySelector('.chevron');
        setTimeout(() => {
          if (body) body.classList.remove('show');
          if (chevron) chevron.classList.remove('open');
        }, 600);
        reasoningPanel = null;
      }
      break;

    case 'tool_call':
      addToolCall(data.name, data.arguments, data.id);
      break;

    case 'tool_result':
      addToolResult(data.name, data.result, data.id);
      break;

    case 'system':
      addSystem(data.content);
      setBusy(false);
      break;

    case 'error':
      addError(data.content);
      reasoningPanel = null;
      setBusy(false);
      break;
  }
}

// ── Message rendering ──
function addMsg(cls, text, timestamp) {
  const isChat = (cls === 'user' || cls === 'assistant');
  const row = document.createElement('div');
  row.className = `msg-row ${cls}`;

  if (isChat) {
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (cls === 'user') {
      avatar.textContent = 'U';
    } else {
      setAssistantAvatar(avatar, sessionAvatar);
    }
    row.appendChild(avatar);
  }

  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  el.textContent = text;

  if (isChat) {
    const content = document.createElement('div');
    content.className = 'msg-content';
    content.appendChild(el);
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = timestamp ? formatTime(new Date(timestamp * 1000)) : formatTime(new Date());
    content.appendChild(time);
    row.appendChild(content);
  } else {
    row.appendChild(el);
  }

  chat.appendChild(row);
  if (isChat) hideWelcome();
  scrollDown();
  return el;
}

function addAssistant(text) { return addMsg('assistant', text); }

function addSystem(t) {
  const row = document.createElement('div');
  row.className = 'msg-row system';
  const card = document.createElement('div');
  card.className = 'system-card';
  const isBlock = t.includes('\n') || t.length > 80;
  if (isBlock) {
    card.innerHTML = `<div class="system-header"><span class="system-icon">📋</span> System</div><pre class="system-body">${escHtml(t)}</pre>`;
  } else {
    card.classList.add('system-inline');
    card.innerHTML = `<span class="system-icon">ℹ️</span> <span>${escHtml(t)}</span>`;
  }
  row.appendChild(card);
  chat.appendChild(row);
  scrollDown();
}

function addError(t) {
  const row = document.createElement('div');
  row.className = 'msg-row error';
  const card = document.createElement('div');
  card.className = 'system-card system-inline error-card';
  card.innerHTML = `<span class="system-icon">⚠️</span> <span style="color:var(--accent-error)">${escHtml(t)}</span>`;
  row.appendChild(card);
  chat.appendChild(row);
  scrollDown();
}

function addToolCall(name, args, id) {
  const panel = document.createElement('div');
  panel.className = 'tool-panel';
  panel.dataset.toolId = id;

  let argsDisplay = args;
  try { argsDisplay = JSON.stringify(JSON.parse(args), null, 2); } catch(e) {}

  panel.innerHTML = `
    <div class="tool-header" onclick="toggleTool(this)">
      <span class="tool-icon">⚡</span>
      <span class="tool-name">${escHtml(name)}</span>
      <span style="color:var(--dim);font-size:12px">${escHtml(truncateStr(args, 80))}</span>
      <span class="chevron">▸</span>
    </div>
    <div class="tool-body">${escHtml(argsDisplay)}</div>
  `;
  chat.appendChild(panel);
  hideWelcome();
  scrollDown();
}

function addToolResult(name, result, id) {
  // Find matching tool panel and append result
  const panels = chat.querySelectorAll('.tool-panel');
  for (const p of panels) {
    if (p.dataset.toolId === id) {
      const body = p.querySelector('.tool-body');
      body.textContent += '\n─── result ───\n' + result;
      return;
    }
  }
  // Fallback: standalone result
  const el = document.createElement('div');
  el.className = 'tool-panel';
  el.innerHTML = `
    <div class="tool-header" onclick="toggleTool(this)">
      <span class="tool-icon">📋</span>
      <span class="tool-name">${escHtml(name)} result</span>
      <span class="chevron">▸</span>
    </div>
    <div class="tool-body show">${escHtml(result)}</div>
  `;
  chat.appendChild(el);
  scrollDown();
}

function renderMarkdown(el) {
  const raw = el._rawText || el.textContent;
  el.innerHTML = marked.parse(raw);

  // Add language labels and copy buttons to code blocks
  el.querySelectorAll('pre').forEach(pre => {
    pre.style.position = 'relative';
    const codeEl = pre.querySelector('code');
    if (codeEl) {
      const cls = [...codeEl.classList].find(c => c.startsWith('language-'));
      if (cls) {
        const label = document.createElement('span');
        label.className = 'code-lang-label';
        label.textContent = cls.replace('language-', '');
        pre.appendChild(label);
      }
    }
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code?.textContent || pre.textContent);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    };
    pre.appendChild(btn);
  });

  // Highlight code blocks
  el.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });
}

// ── Session sidebar ──
function renderSessionList() {
  sessionList.innerHTML = '';
  sessions.sort((a, b) => (b.updated_at || b.created_at || 0) - (a.updated_at || a.created_at || 0));
  for (const s of sessions) {
    const item = document.createElement('div');
    item.className = `session-item${s.id === currentSessionId ? ' active' : ''}`;
    const ts = s.updated_at || s.created_at;
    item.innerHTML = `
      <div class="session-top">
        <span class="name">${escHtml(s.name)}</span>
        <span class="meta">${s.messages || 0}msg</span>
      </div>
      <span class="session-time">${ts ? timeAgo(ts) : ''}</span>
    `;
    item.onclick = () => {
      if (s.id !== currentSessionId) {
        sendCmd(`/switch ${s.id}`);
      }
    };
    sessionList.appendChild(item);
  }
  const active = sessions.find(s => s.id === currentSessionId);
  if (active) {
    sessionNameEl.textContent = active.name;
    sessionIdEl.textContent = active.id.slice(0, 12);
  }
}

function newSession() {
  if (confirm('开启新的对话？')) {
    sendCmd('/session_new');
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── Helpers ──
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncateStr(s, max) {
  return s.length > max ? s.slice(0, max) + '…' : s;
}
function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function setAssistantAvatar(node, avatarValue) {
  node.replaceChildren();
  if (avatarValue && (avatarValue.startsWith('http') || avatarValue.startsWith('data:'))) {
    const img = document.createElement('img');
    img.src = avatarValue;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.borderRadius = '50%';
    img.style.objectFit = 'cover';
    node.appendChild(img);
    return;
  }
  node.textContent = avatarValue || '🦀';
}
function applySessionAvatar(nextAvatar) {
  sessionAvatar = nextAvatar;
  chat.querySelectorAll('.msg-row.assistant .msg-avatar').forEach(node => {
    setAssistantAvatar(node, sessionAvatar);
  });
}
function formatTime(d) {
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}
function timeAgo(ts) {
  const diff = Date.now() - ts * 1000;
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return '刚刚';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}分钟前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}小时前`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day}天前`;
  return new Date(ts * 1000).toLocaleDateString('zh-CN');
}
function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}
function showWelcome() {
  if (document.getElementById('welcome')) return;
  const w = document.createElement('div');
  w.className = 'welcome';
  w.id = 'welcome';
  w.innerHTML = `
    <div class="welcome-logo">🦀</div>
    <div class="welcome-title">LingClaw</div>
    <div class="welcome-hint">
      你的私人 AI 助手已就绪<br>
      输入消息开始对话，或使用 <strong>/</strong> 命令
    </div>
    <div class="welcome-shortcuts">
      <button onclick="sendCmd('/status')">📊 Status</button>
      <button onclick="sendCmd('/help')">❓ Help</button>
      <button onclick="newSession()">✨ New Chat</button>
    </div>
  `;
  chat.appendChild(w);
}
function setBusy(b) {
  busy = b;
  sendBtn.disabled = b;
  sendIcon.innerHTML = b ? '<span class="spinner"></span>' : '↑';
}
function toggleTool(header) {
  header.querySelector('.chevron').classList.toggle('open');
  header.nextElementSibling.classList.toggle('show');
}

// ── Input ──
function send() {
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;

  if (!text.startsWith('/')) {
    addMsg('user', text);
    setBusy(true);
  }

  ws.send(text);
  input.value = '';
  input.style.height = 'auto';
}

function sendCmd(cmd) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(cmd);
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', send);

connect();
</script>
</body>
</html>
